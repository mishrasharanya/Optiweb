<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMPL Playground — Try</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="clientZip.js"></script>
  <script defer src="neosClient.js"></script>
  <style>
    .try-toolbar {
      display:grid;
      grid-template-columns:minmax(180px,.8fr) minmax(240px,1fr) auto;
      gap:18px;
      align-items:end;
    }
    .try-toolbar select,
    .try-toolbar input {
      width:100%;
      min-height:44px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#0b1117;
      color:var(--text);
      padding:9px 12px;
      font:inherit;
    }
    .try-files textarea { min-height:180px; }
    .viewer-card { overflow:hidden; }
    .viewer-heading { margin:0; }
    .status-pill {
      display:inline-flex;
      margin-top:6px;
      padding:4px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      background:rgba(77,163,255,.08);
      color:var(--sub);
      font-size:13px;
    }
    .scene-shell {
      height:480px;
      margin-top:16px;
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
      background:linear-gradient(180deg,#111b27,#0b1117);
    }
    .run-status:empty { display:none; }
    @media (max-width:800px) {
      .try-toolbar { grid-template-columns:1fr; }
      .scene-shell { height:380px; }
    }
  </style>
</head>
<body class="page">
  <header class="site-header">
    <div class="container">
      <a class="back" href="index.html">← Home</a>
      <h1>Try a trajectory problem</h1>
      <p class="subtitle">Run a NEOS example and inspect the seed trajectory in Three.js.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="try-toolbar">
        <div>
          <label class="label" for="demoCase">Example</label>
          <select id="demoCase">
            <option value="moving">Moving block</option>
            <option value="cart">Cart-pole</option>
            <option value="five">Five-linked robot</option>
          </select>
        </div>
        <div style="min-width:260px;">
          <label class="label" for="neosEmail">Email for NEOS</label>
          <input id="neosEmail" type="email" placeholder="you@example.com" required />
        </div>
        <div class="btn-row">
          <button class="btn" id="btnReload" type="button">Reload example</button>
          <button class="btn btn--primary" id="btnRun" type="button">Run on NEOS</button>
          <button class="btn" id="btnDownloadZip" type="button">Download Results ZIP</button>
        </div>
      </div>

      <div class="grid-3 try-files" style="margin-top:1rem;">
        <div>
          <label class="label">.dat</label>
          <textarea id="datText" readonly></textarea>
        </div>
        <div>
          <label class="label">.mod</label>
          <textarea id="modText" readonly></textarea>
        </div>
        <div>
          <label class="label">.run</label>
          <textarea id="runText" readonly></textarea>
        </div>
      </div>
    </section>

    <section class="card viewer-card" style="margin-top:12px;">
      <div class="info-row">
        <div>
          <h3 id="vizTitle" class="viewer-heading">Trajectory</h3>
          <span id="vizStatus" class="status-pill">Loading example…</span>
        </div>
        <div class="btn-row">
          <button class="btn" id="btnPlay" type="button">Play</button>
          <button class="btn" id="btnPause" type="button">Pause</button>
          <button class="btn" id="btnReset" type="button">Reset</button>
        </div>
      </div>
      <div id="threeScene" class="scene-shell"></div>
      <p id="frameValues" class="mono muted"></p>
    </section>

    <pre id="serverResponse" class="card mono run-status" style="margin-top:12px; white-space:pre-wrap;"></pre>
    <pre id="neosResponse" class="card mono run-status" style="margin-top:12px; white-space:pre-wrap;"></pre>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

    const cases = {
      moving: {
        title: 'Moving block',
        base: 'demos/moving/test',
        dof: 1
      },
      cart: {
        title: 'Cart-pole',
        base: 'demos/cart/test',
        dof: 2
      },
      five: {
        title: 'Five-linked robot',
        base: 'demos/five/test',
        dof: 5
      }
    };

    const demoCase = document.getElementById('demoCase');
    const requestedCase = new URLSearchParams(location.search).get('case');
    if (requestedCase && cases[requestedCase]) demoCase.value = requestedCase;
    const emailInput = document.getElementById('neosEmail');
    const datText = document.getElementById('datText');
    const modText = document.getElementById('modText');
    const runText = document.getElementById('runText');
    const btnReload = document.getElementById('btnReload');
    const btnRun = document.getElementById('btnRun');
    const btnDownloadZip = document.getElementById('btnDownloadZip');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const btnReset = document.getElementById('btnReset');
    const vizTitle = document.getElementById('vizTitle');
    const vizStatus = document.getElementById('vizStatus');
    const frameValues = document.getElementById('frameValues');
    const serverResponse = document.getElementById('serverResponse');
    const neosResponse = document.getElementById('neosResponse');
    const host = document.getElementById('threeScene');

    let frames = [];
    let animationFrame = null;
    let animationStart = 0;
    let pausedProgress = 0;
    let visual = {};
    let currentJobNumber = null;
    let neosResultsReady = false;
    let latestNeosResult = null;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f7fb);
    const camera = new THREE.OrthographicCamera(-4.5, 4.5, 3.2, -3.2, 0.1, 100);
    camera.position.set(0, 1.5, 10);
    camera.lookAt(0, 0.5, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    host.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x64748b, 2.2));
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(3, 6, 8);
    scene.add(light);

    function resize() {
      renderer.setSize(host.clientWidth, host.clientHeight);
      renderer.render(scene, camera);
    }
    window.addEventListener('resize', resize);

    function clearVisual() {
      if (visual.root) {
        scene.remove(visual.root);
        visual.root.traverse(object => {
          object.geometry?.dispose();
          if (Array.isArray(object.material)) object.material.forEach(material => material.dispose());
          else object.material?.dispose();
        });
      }
      visual = { root: new THREE.Group() };
      scene.add(visual.root);
    }

    function material(color) {
      return new THREE.MeshStandardMaterial({ color, roughness: 0.65 });
    }

    function makeLink(length = 1, color = 0x2563eb) {
      const link = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.07, length, 16),
        material(color)
      );
      visual.root.add(link);
      return link;
    }

    function positionLink(link, start, end) {
      const midpoint = start.clone().add(end).multiplyScalar(0.5);
      link.position.copy(midpoint);
      link.scale.y = start.distanceTo(end);
      link.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        end.clone().sub(start).normalize()
      );
    }

    function buildScene(type) {
      clearVisual();
      visual.root.add(new THREE.GridHelper(9, 18, 0x94a3b8, 0xd8dee9));

      if (type === 'moving') {
        visual.block = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), material(0xf97316));
        visual.block.position.y = 0.3;
        visual.root.add(visual.block);
      } else if (type === 'cart') {
        visual.cart = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.42, 0.7), material(0x2563eb));
        body.position.y = 0.45;
        visual.cart.add(body);
        for (const x of [-0.38, 0.38]) {
          const wheel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.18, 0.16, 20),
            material(0x1f2937)
          );
          wheel.rotation.x = Math.PI / 2;
          wheel.position.set(x, 0.18, 0.38);
          visual.cart.add(wheel);
        }
        visual.pivot = new THREE.Group();
        visual.pivot.position.y = 0.7;
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1.8, 16), material(0xef4444));
        rod.position.y = 0.9;
        visual.pivot.add(rod);
        const bob = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16), material(0xf59e0b));
        bob.position.y = 1.8;
        visual.pivot.add(bob);
        visual.cart.add(visual.pivot);
        visual.root.add(visual.cart);
      } else {
        visual.links = [makeLink(), makeLink(), makeLink(), makeLink(), makeLink(0.9, 0xf97316)];
        visual.joints = Array.from({ length: 5 }, () => {
          const joint = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 12), material(0x111827));
          visual.root.add(joint);
          return joint;
        });
      }
      resize();
    }

    function updateVisual(q) {
      const type = demoCase.value;
      if (type === 'moving') {
        visual.block.position.x = -3 + 6 * (q[0] ?? 0);
      } else if (type === 'cart') {
        visual.cart.position.x = -2.5 + 5 * (q[0] ?? 0);
        visual.pivot.rotation.z = -(q[1] ?? 0);
      } else {
        const pelvis = new THREE.Vector3(0, 1.8, 0);
        const torsoEnd = new THREE.Vector3(
          0.9 * Math.sin(q[0] ?? 0),
          1.8 + 0.9 * Math.cos(q[0] ?? 0),
          0
        );
        const leg = (hipAngle, kneeAngle, side) => {
          const hip = pelvis.clone().add(new THREE.Vector3(side * 0.12, 0, 0));
          const a1 = (q[0] ?? 0) + hipAngle;
          const knee = hip.clone().add(new THREE.Vector3(Math.sin(a1), -Math.cos(a1), 0));
          const a2 = a1 + kneeAngle;
          const ankle = knee.clone().add(new THREE.Vector3(Math.sin(a2), -Math.cos(a2), 0));
          return { hip, knee, ankle };
        };
        const stance = leg(q[1] ?? 0, q[2] ?? 0, -1);
        const swing = leg(q[3] ?? 0, q[4] ?? 0, 1);
        positionLink(visual.links[0], pelvis, torsoEnd);
        positionLink(visual.links[1], stance.hip, stance.knee);
        positionLink(visual.links[2], stance.knee, stance.ankle);
        positionLink(visual.links[3], swing.hip, swing.knee);
        positionLink(visual.links[4], swing.knee, swing.ankle);
        [pelvis, stance.knee, stance.ankle, swing.knee, swing.ankle]
          .forEach((point, index) => visual.joints[index].position.copy(point));
      }
      renderer.render(scene, camera);
    }

    function parseSeed(dat, dof) {
      const qBlock = dat.match(/var\s+q\s*:=\s*\[:,\*\]([\s\S]*?);/i)?.[1] || '';
      const tBlock = dat.match(/var\s+t\s*:=\s*\[\*\]([\s\S]*?);/i)?.[1] || '';
      const qRows = qBlock.split(/\r?\n/).map(line => line.trim().split(/\s+/))
        .filter(parts => Number.isFinite(Number(parts[0])) && parts.length >= dof + 1)
        .map(parts => ({ index: Number(parts[0]), q: parts.slice(1, dof + 1).map(Number) }));
      const time = new Map(
        tBlock.split(/\r?\n/).map(line => line.trim().split(/\s+/))
          .filter(parts => parts.length >= 2 && parts.every(value => Number.isFinite(Number(value))))
          .map(parts => [Number(parts[0]), Number(parts[1])])
      );
      return qRows.map((row, index) => ({
        time: time.get(row.index) ?? index,
        q: row.q
      }));
    }

    function parseSolverTrajectory(output, dof) {
      const text = String(output || '');
      const block = text.match(/TRAJECTORY_BEGIN([\s\S]*?)TRAJECTORY_END/i)?.[1] || text;

      const times = new Map();
      const qByIndex = new Map();
      const numericIndex = value => {
        const number = Number(value);
        return Number.isFinite(number) ? number : value;
      };

      for (const line of block.split(/\r?\n/)) {
        const match = line.match(/^\s*(?:\d+\s+)?(q|t)\[([^\]]+)\]\s+([-+.\deE]+)\s*$/i);
        if (!match) continue;

        const [, kind, rawIndexes, rawValue] = match;
        const value = Number(rawValue);
        if (!Number.isFinite(value)) continue;

        const indexes = rawIndexes.split(',').map(part => part.trim());
        if (kind.toLowerCase() === 't') {
          times.set(indexes[0], value);
          continue;
        }

        const component = Number(indexes[0]) - 1;
        const gridIndex = indexes[1];
        if (!Number.isInteger(component) || component < 0 || component >= dof || !gridIndex) continue;

        const row = qByIndex.get(gridIndex) || Array.from({ length: dof }, () => 0);
        row[component] = value;
        qByIndex.set(gridIndex, row);
      }

      return [...qByIndex.entries()]
        .sort(([left], [right]) => {
          const a = numericIndex(left);
          const b = numericIndex(right);
          if (typeof a === 'number' && typeof b === 'number') return a - b;
          return String(left).localeCompare(String(right));
        })
        .map(([index, q], order) => ({
          time: times.get(index) ?? order,
          q
        }));
    }

    function combinedNeosText(result) {
      return [
        result?.output,
        result?.amplOutput,
        result?.resultsTxt,
        result?.jobResults,
        result?.jobOut
      ].filter(Boolean).join('\n\n');
    }

    function setFrames(nextFrames, source) {
      const validFrames = (nextFrames || [])
        .filter(frame => Array.isArray(frame?.q) && frame.q.every(Number.isFinite));
      if (!validFrames.length) {
        vizStatus.textContent = `No trajectory was found in ${source}.`;
        pausedProgress = 0;
        if (frames.length) updateVisual(frames[0].q);
        return false;
      }

      frames = validFrames;
      pausedProgress = 0;
      updateVisual(frames[0].q);
      frameValues.textContent =
        `t=${frames[0].time.toFixed(4)}  q=[${frames[0].q.map(value => value.toFixed(4)).join(', ')}]`;
      vizStatus.textContent = `${frames.length} frames loaded from ${source}.`;
      return true;
    }

    async function loadExample() {
      cancelAnimationFrame(animationFrame);
      const config = cases[demoCase.value];
      vizTitle.textContent = config.title;
      vizStatus.textContent = 'Loading example files...';
      const [datResponse, modResponse, runResponse] = await Promise.all(
        ['dat', 'mod', 'run'].map(extension => fetch(`${config.base}.${extension}`))
      );
      if (![datResponse, modResponse, runResponse].every(response => response.ok)) {
        throw new Error('Could not load one or more example files.');
      }
      [datText.value, modText.value, runText.value] = await Promise.all([
        datResponse.text(), modResponse.text(), runResponse.text()
      ]);
      buildScene(demoCase.value);
      frames = [];
      setFrames(parseSeed(datText.value, config.dof), 'the example seed');
      currentJobNumber = null;
      neosResultsReady = false;
      latestNeosResult = null;
      neosResponse.textContent = '';
      serverResponse.textContent = 'Example loaded. Preview the seed trajectory or run the files on NEOS.';
    }

    function interpolatedFrame(progress) {
      const frameCount = frames.length;
      const safeProgress = Number.isFinite(progress)
        ? Math.min(1, Math.max(0, progress))
        : 0;
      const scaled = safeProgress * Math.max(0, frameCount - 1);
      const lower = Math.min(frameCount - 1, Math.max(0, Math.floor(scaled)));
      const upper = Math.min(frameCount - 1, lower + 1);
      const blend = scaled - lower;
      const from = frames[lower] || frames[0];
      const to = frames[upper] || from;
      const q = from.q.map((value, index) => {
        let delta = (to.q[index] ?? value) - value;
        if (demoCase.value === 'five') {
          delta = Math.atan2(Math.sin(delta), Math.cos(delta));
        }
        return value + delta * blend;
      });
      return {
        time: from.time + (to.time - from.time) * blend,
        q
      };
    }

    function play() {
      if (!frames.length) return;
      cancelAnimationFrame(animationFrame);
      const duration = 5000;
      animationStart = performance.now() - pausedProgress * duration;
      const tick = now => {
        const progress = Math.min(1, (now - animationStart) / duration);
        const frame = interpolatedFrame(progress);
        updateVisual(frame.q);
        frameValues.textContent = `t=${frame.time.toFixed(4)}  q=[${frame.q.map(value => value.toFixed(4)).join(', ')}]`;
        pausedProgress = progress;
        if (progress < 1) animationFrame = requestAnimationFrame(tick);
      };
      animationFrame = requestAnimationFrame(tick);
    }

    btnPlay.addEventListener('click', play);
    btnPause.addEventListener('click', () => cancelAnimationFrame(animationFrame));
    btnReset.addEventListener('click', () => {
      cancelAnimationFrame(animationFrame);
      pausedProgress = 0;
      if (frames.length) updateVisual(frames[0].q);
    });
    btnReload.addEventListener('click', () => loadExample().catch(showError));
    demoCase.addEventListener('change', () => loadExample().catch(showError));

    btnDownloadZip.addEventListener('click', async () => {
      if (!currentJobNumber) {
        return showWarning('NEOS problem has not been run yet. Submit the example first, then download the ZIP after it finishes.');
      }

      if (!neosResultsReady) {
        return showWarning('NEOS problem is still running. The ZIP will be available after the job is done.');
      }

      try {
        await window.OptiWebZip.downloadNeosZip({
          jobNumber: currentJobNumber,
          dat: datText.value,
          mod: modText.value,
          run: runText.value,
          neosOutput: combinedNeosText(latestNeosResult),
          jobOut: latestNeosResult?.jobOut || '',
          emailStatus: latestNeosResult?.emailStatus || '',
          summary: neosResponse.textContent
        });
      } catch (error) {
        showError(error);
      }
    });

    btnRun.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        return showError(new Error('Enter a valid email address for NEOS.'));
      }

      btnRun.disabled = true;
      btnRun.textContent = 'Submitting...';
      currentJobNumber = null;
      neosResultsReady = false;
      latestNeosResult = null;
      neosResponse.textContent = '';
      serverResponse.textContent = 'Preparing the selected example for NEOS...';

      try {
        const job = await window.submitNeosJob({
          email,
          dat: datText.value,
          mod: modText.value,
          run: runText.value
        });

        currentJobNumber = job.jobNumber;
        serverResponse.textContent =
          `Submitted successfully\nJob: ${job.jobNumber}\nSolver: ${job.solver}\nStatus: Waiting\n\n` +
          `The Three.js animation will update if NEOS returns a trajectory block.`;
        neosResponse.textContent =
          `NEOS Job Information\n\n` +
          `Email      : ${email}\n` +
          `Category   : ${job.category}\n` +
          `Solver     : ${job.solver}\n` +
          `Input      : ${job.inputMethod}\n` +
          `Job Number : ${job.jobNumber}\n` +
          `Password   : ${job.password}\n` +
          `Status     : Submitted\n\nWaiting for NEOS output...`;

        let result;
        do {
          await new Promise(resolve => setTimeout(resolve, 5000));
          result = await window.getNeosResults(job.jobNumber, job.password);
          latestNeosResult = result;

          serverResponse.textContent =
            `Job: ${job.jobNumber}\nSolver: ${job.solver}\nStatus: ${result.status}\n\n` +
            `The Three.js animation will update if NEOS returns a trajectory block.`;
          neosResponse.textContent =
            `NEOS Job Information\n\n` +
            `Email      : ${email}\n` +
            `Category   : ${job.category}\n` +
            `Solver     : ${job.solver}\n` +
            `Input      : ${job.inputMethod}\n` +
            `Job Number : ${job.jobNumber}\n` +
            `Password   : ${job.password}\n` +
            `Status     : ${result.status}\n\n` +
            `===== NEOS Output =====\n${result.output || 'Waiting for output...'}\n\n` +
            `===== AMPL Output =====\n${result.amplOutput || 'AMPL output not available yet'}\n\n` +
            `===== results.txt =====\n${result.resultsTxt || 'results.txt not available yet'}\n\n` +
            `===== job.results =====\n${result.jobResults || 'job.results not available yet'}\n\n` +
            `===== job.out =====\n${result.jobOut || 'job.out not available yet'}\n\n` +
            `===== Email Status =====\n${result.emailStatus || 'Email status not available yet'}`;
        } while (result.status !== 'Done');

        const optimizedFrames = parseSolverTrajectory(
          combinedNeosText(result),
          cases[demoCase.value].dof
        );
        const optimizedLoaded = setFrames(optimizedFrames, 'the optimized NEOS solution');
        neosResultsReady = true;
        serverResponse.textContent += optimizedLoaded
          ? '\nNEOS job complete. Optimized trajectory loaded. Results ZIP is ready to download.'
          : '\nNEOS job complete. Results ZIP is ready; seed trajectory remains because no trajectory block was returned.';
      } catch (error) {
        showError(error);
      } finally {
        btnRun.disabled = false;
        btnRun.textContent = 'Run on NEOS';
      }
    });

    function showError(error) {
      serverResponse.textContent = `ERROR: ${error.message}`;
    }

    function showWarning(message) {
      alert(message);
      serverResponse.textContent = message;
    }

    loadExample().catch(showError);
  </script>
</body>
</html>
